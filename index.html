<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Bubuu</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><div id="app">
<section id="home">
  <div class="cover">
    <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
      <rect width="400" height="400" fill="#FFD0B8"/>
      <path fill="#155F67" d="M60 120C60 50 180 30 260 60S370 90 350 190 380 330 270 360 70 330 50 250 40 170 60 120Z"/>
      <path fill="#155F67" d="M-20 320C40 280 90 350 70 420H-20Z"/>
      <path fill="#155F67" d="M290-20C330 40 390 20 420 70V-20Z"/>
    </svg>
    <h1 id="cvTitle"></h1>
  </div>
  <div class="hcd"><small>MY QUEEN'S BIRTHDAY IS NEAR, LOVE YOU 💓</small>
    <div><p><b id="hd">0</b>DAYS</p><p><b id="hh">0</b>HRS</p><p><b id="hm">0</b>MINS</p><p><b id="hs">0</b>SECS</p></div></div>
  <h2 id="plTitle"></h2><p id="plSub"></p>
  <div class="actions"><span>♡</span><button id="bigPlay">▶</button></div>
  <button id="wrapBtn" class="wrapbtn">▶ OPEN BUBUU WRAPPED 2026 💓</button>
  <ul id="tracks"></ul>
</section>
<section id="view">
  <header><button id="back">⌄</button><div><small>PLAYING FROM PLAYLIST</small><b id="vPl"></b></div></header>
  <h3 id="vTitle"></h3><div id="vBody"></div>
</section>
<div id="mini"><div><b id="mTitle">Pick a song</b><small id="mArt"></small></div>
<button id="mPlay">▶</button><i id="bar"><u></u></i></div>
</div>
<audio id="au" src="song.mp3" loop></audio>
<script src="script.js"></script></body></html>
